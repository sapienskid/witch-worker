name = "witch-worker"
main = "src/index.ts"
compatibility_date = "2024-11-01"
workers_dev = true

# R2 bucket used as the content store. Content is stored under the `content/`
# prefix and media under `images/`; the CMS plugin uploads images straight to
# this bucket via S3.
[[r2_buckets]]
binding = "SITE_CONTENT"
bucket_name = "portfolio"

# Periodic rebuild so scheduled posts publish automatically.
[triggers]
crons = ["*/5 * * * *"]
